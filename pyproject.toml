[project]
name = "xkbeditor"
version = "0.1.0"
description = "A GUI editor for Linux keyboard layouts"
readme = "README.md"
authors = [
  { name = "Damglador", email = "vse.stopchanskyi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
  "pydantic",
  "lark",
  "pytest>=9.1.1",
  "pyside6>=6.11.1",
]

[project.gui-scripts]
xkb-editor = "xkbeditor.__main__:main"

[tool.setuptools]
package-dir = {xkbeditor = "xkbeditor"}

[tool.setuptools.package-data]
"xkbeditor.translations" = ['**']
"xkbeditor.qt.qml" = ['**']
"xkbeditor.parser" = ['*.lark']
